<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Maintenance</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Subtle Glow Effects -->
  <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Maintenance Card -->
  <main class="relative z-10 max-w-lg w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 sm:p-10 text-center shadow-2xl">
    
    <!-- Status Badge -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-medium mb-6">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
      <span>Scheduled Maintenance</span>
    </div>

    <!-- Gear / Wrench Icon -->
    <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 p-0.5 shadow-lg shadow-indigo-500/25">
      <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
        <svg class="w-8 h-8 text-cyan-400 animate-spin" style="animation-duration: 8s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
    </div>

    <!-- Heading & Description -->
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-3">
      We're Upgrading Things!
    </h1>
    <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8">
      Hum apni website ko aur behtar bana rahe hain. Kuch hi der mein hum naye features ke saath wapas online honge. Tab tak ke liye dhanyavaad!
    </p>

    <!-- Progress Bar -->
    <div class="mb-8 text-left">
      <div class="flex justify-between text-xs font-medium text-slate-400 mb-2">
        <span>System Upgrade Progress</span>
        <span class="text-cyan-400">75%</span>
      </div>
      <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden p-0.5">
        <div class="h-full bg-gradient-to-r from-indigo-500 to-cyan-400 rounded-full w-3/4 animate-pulse"></div>
      </div>
    </div>

    <!-- Notify / Contact Section -->
    <div class="pt-6 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-4">
      <span class="text-xs text-slate-500">Koi urgent kaam hai?</span>
      <a href="mailto:support@yourdomain.com" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white text-slate-950 font-semibold text-xs sm:text-sm hover:bg-slate-200 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Contact Support
      </a>
    </div>

  </main>

</body>
</html>
